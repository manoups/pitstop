type: specs.openrewrite.org/v1beta/recipe
name: io.fluxzero.MigrateToFluxzero
displayName: Migrate to the Fluxzero Java SDK
recipeList:
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: io.flux-capacitor
      oldArtifactId: flux-capacitor-bom
      newGroupId: io.fluxzero
      newArtifactId: fluxzero-bom
      newVersion: 0.7.0
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: io.flux-capacitor
      oldArtifactId: java-client
      newGroupId: io.fluxzero
      newArtifactId: sdk
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: io.flux-capacitor
      oldArtifactId: proxy
      newGroupId: io.fluxzero
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: io.flux-capacitor
      oldArtifactId: test-server
      newGroupId: io.fluxzero
  - org.openrewrite.java.ChangePackage:
      oldPackageName: io.fluxcapacitor.javaclient
      newPackageName: io.fluxzero.sdk
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: io.fluxcapacitor
      newPackageName: io.fluxzero
      recursive: true
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.fluxzero.javaclient.FluxCapacitor
      newFullyQualifiedTypeName: io.fluxcapacitor.sdk.Fluxzero
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.fluxzero.javaclient.test.TestFixture getFluxCapacitor
      newMethodName: getFluxzero
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.fluxzero.javaclient.configuration.DefaultFluxCapacitor
      newFullyQualifiedTypeName: io.fluxcapacitor.sdk.configuration.DefaultFluxzero
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.fluxzero.javaclient.common.logging.FluxCapacitorLogbackAppender
      newFullyQualifiedTypeName: io.fluxcapacitor.sdk.common.logging.FluxzeroLogbackAppender
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.fluxzero.javaclient.common.logging.FluxCapacitorLogbackAppenderTest
      newFullyQualifiedTypeName: io.fluxcapacitor.sdk.common.logging.FluxzeroLogbackAppenderTest
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.fluxzero.javaclient.configuration.FluxCapacitorBuilder
      newFullyQualifiedTypeName: io.fluxcapacitor.sdk.configuration.FluxzeroBuilder
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.fluxzero.javaclient.configuration.FluxCapacitorConfiguration
      newFullyQualifiedTypeName: io.fluxcapacitor.sdk.configuration.FluxzeroConfiguration
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.fluxzero.javaclient.configuration.FluxCapacitorConfigTest
      newFullyQualifiedTypeName: io.fluxcapacitor.sdk.configuration.FluxzeroConfigTest
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.fluxzero.javaclient.configuration.spring.FluxCapacitorCustomizer
      newFullyQualifiedTypeName: io.fluxcapacitor.sdk.configuration.spring.FluxzeroCustomizer
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.fluxzero.javaclient.configuration.spring.FluxCapacitorSpringConfigTest
      newFullyQualifiedTypeName: io.fluxcapacitor.sdk.configuration.spring.FluxzeroSpringConfigTest
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.fluxzero.javaclient.configuration.spring.FluxCapacitorSpringConfig
      newFullyQualifiedTypeName: io.fluxcapacitor.sdk.configuration.spring.FluxzeroSpringConfig
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.fluxzero.javaclient.test.SpyingFluxCapacitor
      newFullyQualifiedTypeName: io.fluxcapacitor.sdk.test.SpyingFluxzero
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.fluxzero.javaclient.test.spring.FluxCapacitorTestConfig
      newFullyQualifiedTypeName: io.fluxcapacitor.sdk.test.spring.FluxzeroTestConfig
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.fluxzero.javaclient.tracking.FluxCapacitorInterceptor
      newFullyQualifiedTypeName: io.fluxcapacitor.sdk.tracking.FluxzeroInterceptor
  - org.openrewrite.RenameFile:
      fileMatcher: "**/io.fluxcapacitor.javaclient.tracking.handling.authentication.UserProvider"
      fileName: "io.fluxzero.sdk.tracking.handling.authentication.UserProvider"
  - org.openrewrite.text.FindAndReplace:
      find: "io.fluxcapacitor.javaclient"
      replace: "io.fluxzero.sdk"
      filePattern: "!(rewrite.yml)"
  - org.openrewrite.text.FindAndReplace:
      find: "io.flux-?capacitor"
      replace: "io.fluxzero"
      filePattern: "!(rewrite.yml)"
  - org.openrewrite.text.FindAndReplace:
      find: "FluxCapacitor"
      replace: "Fluxzero"
      filePattern: "!(rewrite.yml)"
      caseSensitive: true