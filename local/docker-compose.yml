services:
  fluxzero-runtime:
    image: ghcr.io/fluxzero-io/fluxzero-sdk-java/fluxzero-test:1.144.0
    environment:
      - FLUXZERO_LOG_RETENTION=PT30M
    ports:
      - "8888:8888"

  fluxzero-runtime-ready:
    image: alpine:3.20
    depends_on:
      - fluxzero-runtime
    command: >
      sh -c "apk add --no-cache curl >/dev/null &&
             until curl -fs http://fluxzero-runtime:8888/health; do
               echo 'waiting for fluxzero-runtime...';
               sleep 2;
             done"
    restart: "no"

  pitstop-proxy:
    image: ghcr.io/fluxzero-io/fluxzero-sdk-java/fluxzero-proxy:1.144.0
    environment:
      - FLUXZERO_BASE_URL=http://fluxzero-runtime:8888
      - FLUXZERO_APPLICATION_NAME=pitstop-proxy
    ports:
      - "8080:8080"

  pitstop-local:
    profiles: [local]
    build:
      context: ..
      dockerfile: Dockerfile
    # Requires: mvn -pl local-seed -am clean package -DskipTests
    depends_on:
      fluxzero-runtime-ready:
        condition: service_completed_successfully
    environment:
      - ENVIRONMENT=local
      - FLUX_APPLICATION_NAME=pitstop
      - FLUX_BASE_URL=ws://fluxzero-runtime:8888

  opensearch:
    image: opensearchproject/opensearch:3
    environment:
      - discovery.type=single-node
#      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=0pen_Search
      - DISABLE_SECURITY_PLUGIN=true
    healthcheck:
      test: "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"
      interval: 10s

  dashboards:
    build:
      context: dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: "curl -fs http://localhost:5601/api/status"

  auditlog:
    image: ghcr.io/fluxzero-io/fluxzero-auditlog-opensearch:v1.8.1
    environment:
      - FLUXZERO_BASE_URL=http://fluxzero-runtime:8888
      - OPENSEARCH_URL=http://opensearch:9200
      - AUDITLOG_USER=admin
      - AUDITLOG_PASSWORD=0pen_Search
      - DASHBOARDS_URL=http://dashboards:5601
      - DASHBOARDS_USER=admin
      - DASHBOARDS_PASSWORD=0pen_Search
      - DASHBOARDS_TENANT=Rebound
    depends_on:
      dashboards:
        condition: service_healthy
      fluxzero-runtime-ready:
        condition: service_completed_successfully

  keycloak:
    container_name: pitstop-keycloak.openid-provider
    image: quay.io/keycloak/keycloak:latest
    command:
      - start-dev
      - --import-realm
    ports:
      - "8082:8080"
      - "9000:9000"
    volumes:
      - ./pitstop-realm.json/:/opt/keycloak/data/import/pitstop-realm.json
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_ADMIN_URL: http://localhost:8080
      KC_HOSTNAME_STRICT_BACKCHANNEL: true
      KC_HTTP_RELATIVE_PATH: /
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: false
      KC_METRICS_ENABLED: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;" ]
      interval: 10s
      timeout: 5s
      retries: 20


networks:
  postgres_network:
    driver: bridge